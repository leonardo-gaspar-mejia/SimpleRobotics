[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simplerobotics"
version = "1.0.5.2"
description = "Educational Python library for robot kinematics, homogeneous transformations, trajectory interpolation, and 3D visualization."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Leonardo Andrey Gaspar Mejía"},
]

keywords = [
    "robotics",
    "kinematics",
    "homogeneous-transformations",
    "robotics-education",
    "robot-manipulators",
    "trajectory-interpolation",
    "3d-visualization",
    "symbolic-computation",
    "stl-meshes",
]

classifiers = [
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Visualization",
]

dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.5",
    "sympy>=1.12",
    "trimesh>=3.9",
    "pyvista>=0.49.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.urls]
Repository = "https://github.com/leonardo-gaspar-mejia/SimpleRobotics"
Documentation = "https://github.com/leonardo-gaspar-mejia/SimpleRobotics/blob/main/Documentacion.md"
Issues = "https://github.com/leonardo-gaspar-mejia/SimpleRobotics/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["SimpleRobotics*"]